name: Publish CLI

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Runner images can lag behind Node.js security releases.
          check-latest: true
      - uses: oras-project/setup-oras@005458ad77f1c8facd38a094e4af2e69e5607ff4 # v2.0.2
        with:
          version: 1.3.0
      - run: corepack enable && corepack prepare pnpm@10.7.1 --activate
      - run: pnpm install --frozen-lockfile
      - name: Package CLI
        id: package
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          git merge-base --is-ancestor HEAD origin/main
          tag="sha-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          version="$(node -p 'JSON.parse(require("fs").readFileSync("cli/package.json")).version')"
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            [[ "$REF_NAME" == "v${version}" ]]
            tag="$REF_NAME"
          fi
          node scripts/package-cli.mjs
          echo "reference=ghcr.io/${REPOSITORY,,}-cli:${tag}" >> "$GITHUB_OUTPUT"
          echo "filename=trestl-cli-${version}.tgz" >> "$GITHUB_OUTPUT"
      - name: Publish and verify OCI artifact
        working-directory: dist/cli-release
        env:
          REGISTRY_AUTH_FILE: ${{ runner.temp }}/trestl-cli-registry.json
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          REFERENCE: ${{ steps.package.outputs.reference }}
          FILENAME: ${{ steps.package.outputs.filename }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
        run: |
          set -euo pipefail
          printf '%s' "$GHCR_TOKEN" | oras login --registry-config "$REGISTRY_AUTH_FILE" ghcr.io --username "$GHCR_USERNAME" --password-stdin
          oras push --registry-config "$REGISTRY_AUTH_FILE" "$REFERENCE" --artifact-type application/vnd.trestl.cli.v1 \
            --annotation "org.opencontainers.image.source=${SOURCE_URL}" \
            --annotation "org.opencontainers.image.revision=${GITHUB_SHA}" \
            --annotation org.opencontainers.image.licenses=MIT \
            "$FILENAME:application/gzip" SHA256SUMS:text/plain
          digest="$(oras resolve --registry-config "$REGISTRY_AUTH_FILE" "$REFERENCE")"
          oras pull --registry-config "$REGISTRY_AUTH_FILE" "${REFERENCE%:*}@${digest}" --output "$RUNNER_TEMP/trestl-cli-pull"
          (cd "$RUNNER_TEMP/trestl-cli-pull" && sha256sum -c SHA256SUMS)
          cmp "$FILENAME" "$RUNNER_TEMP/trestl-cli-pull/$FILENAME"
          {
            echo '### Published CLI'
            echo "- OCI artifact: \`$REFERENCE\`"
            echo "- Immutable reference: \`${REFERENCE%:*}@${digest}\`"
            echo "- Source: \`$GITHUB_SHA\`"
            echo '- Node.js 22.9+; macOS, Linux and Windows; no runtime dependencies.'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Publish release downloads
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
          FILENAME: ${{ steps.package.outputs.filename }}
        run: |
          set -euo pipefail
          # Existing assets are never silently overwritten on a rerun.
          node scripts/ensure-release.mjs
          gh release upload "$RELEASE_TAG" "dist/cli-release/$FILENAME" dist/cli-release/SHA256SUMS
      - name: Remove registry credentials
        if: always()
        run: rm -f -- "$RUNNER_TEMP/trestl-cli-registry.json"
