name: Publish image

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  verify:
    if: github.event_name != 'workflow_dispatch' || github.ref == 'refs/heads/main'
    uses: ./.github/workflows/ci.yml

  publish:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Runner images can lag behind Node.js security releases.
          check-latest: true

      - name: Select image version
        id: image
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          # Publish only commits already incorporated into main.
          git merge-base --is-ancestor HEAD origin/main
          source_sha="$(git rev-parse HEAD)"
          image="ghcr.io/${REPOSITORY,,}"
          tag="sha-${source_sha}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          if [[ "$REF_TYPE" == tag ]]; then
            [[ "$REF_NAME" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]]
            tag="$REF_NAME"
          fi
          echo "reference=${image}:${tag}" >> "$GITHUB_OUTPUT"
          echo "source_sha=${source_sha}" >> "$GITHUB_OUTPUT"

      - name: Build linux/amd64 image
        env:
          IMAGE: ${{ steps.image.outputs.reference }}
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
          SOURCE_URL: ${{ github.server_url }}/${{ github.repository }}
          BUILD_REF: ${{ github.ref_name }}
          BUILD_ID: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          docker build --platform linux/amd64 \
            --build-arg "TRESTL_BUILD_COMMIT=${SOURCE_SHA}" \
            --build-arg "TRESTL_BUILD_REF=${BUILD_REF}" \
            --build-arg "TRESTL_BUILD_ID=${BUILD_ID}" \
            --build-arg "TRESTL_BUILD_DATE=$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --label "org.opencontainers.image.source=${SOURCE_URL}" \
            --label "org.opencontainers.image.revision=${SOURCE_SHA}" \
            --label "org.opencontainers.image.licenses=MIT" \
            --tag "$IMAGE" .

      - name: Smoke-test the image being published
        env:
          TRESTL_SMOKE_IMAGE: ${{ steps.image.outputs.reference }}
        run: node scripts/test-docker.mjs

      - name: Publish to GHCR
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/trestl-docker-auth
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GHCR_USERNAME: ${{ github.actor }}
          IMAGE: ${{ steps.image.outputs.reference }}
          SOURCE_SHA: ${{ steps.image.outputs.source_sha }}
        run: |
          set -euo pipefail
          mkdir -p "$DOCKER_CONFIG"
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io \
            --username "$GHCR_USERNAME" --password-stdin
          docker push "$IMAGE"
          digest_ref="$(docker image inspect "$IMAGE" --format '{{index .RepoDigests 0}}')"
          {
            echo '### Published image'
            echo "- Image: \`$IMAGE\`"
            echo "- Digest reference: \`$digest_ref\`"
            echo "- Source commit: \`$SOURCE_SHA\`"
            echo '- Platform: linux/amd64'
            echo '- Replicate into your deployment registry and verify its digest before promotion.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove registry credentials
        if: always()
        env:
          DOCKER_CONFIG: ${{ runner.temp }}/trestl-docker-auth
        run: rm -rf -- "$DOCKER_CONFIG"
