name: CI

on:
  push:
    branches: [main, 'release/**']
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  application:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      # Disposable server for the backup tests, which create and drop their own databases.
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: trestl
          POSTGRES_PASSWORD: trestl-ci
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U trestl" --health-interval 5s --health-timeout 5s
          --health-retries 20
    env:
      TRESTL_TEST_DATABASE_URL: postgresql://trestl:trestl-ci@127.0.0.1:5432/postgres
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          # Runner images can lag behind Node.js security releases.
          check-latest: true
      - run: corepack enable && corepack prepare pnpm@10.7.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test
      - run: pnpm build
      - run: pnpm format:check
      - run: pnpm test:cli-package
      - run: kubectl kustomize deploy/kubernetes/examples/basic > /tmp/trestl-kubernetes.yaml

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - run: node scripts/test-docker.mjs

  raycast:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: extensions/raycast
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - run: corepack enable && corepack prepare pnpm@10.7.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm test

  website:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          check-latest: true
      - run: corepack enable && corepack prepare pnpm@10.7.1 --activate
      - run: pnpm install --frozen-lockfile
      - run: pnpm --dir website install --frozen-lockfile
      - run: pnpm --dir website test:demo
      - run: pnpm --dir website build
