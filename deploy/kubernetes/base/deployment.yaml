apiVersion: apps/v1
kind: Deployment
metadata:
  name: trestl
  labels:
    app: trestl
spec:
  replicas: 1
  # The scheduler currently runs in-process. Avoid overlapping application workers.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: trestl
  template:
    metadata:
      labels:
        app: trestl
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: trestl
          # Replace with the image built and pushed to your registry.
          image: trestl:0.2.0
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4317
          env:
            - name: NODE_ENV
              value: production
            - name: HOST
              value: 0.0.0.0
            - name: PORT
              value: '4317'
            - name: SECURE_COOKIES
              value: 'true'
          envFrom:
            - secretRef:
                name: trestl-secrets
          startupProbe:
            httpGet:
              path: /ready
              port: http
            timeoutSeconds: 5
            periodSeconds: 5
            failureThreshold: 60
          readinessProbe:
            httpGet:
              path: /ready
              port: http
            timeoutSeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            timeoutSeconds: 5
            periodSeconds: 30
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: '2'
              memory: 1Gi
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: temp
              mountPath: /tmp
      volumes:
        - name: temp
          emptyDir: {}
