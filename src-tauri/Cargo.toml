[package]
name = "trestl-desktop"
version = "0.4.0"
description = "Trestl desktop workspace"
authors = ["Trestl contributors"]
license = "MIT"
edition = "2021"
rust-version = "1.92"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = [] }
tauri-plugin-single-instance = "2"
tauri-plugin-window-state = "2"
serde_json = "1"
open = "5"
rfd = "0.17"
