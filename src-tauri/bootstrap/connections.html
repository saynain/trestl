<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>Connections — Trestl</title>
    <link rel="stylesheet" href="connections.css" />
  </head>
  <body>
    <div class="drag" data-tauri-drag-region></div>
    <main>
      <header>
        <img src="app-icon.svg" alt="" width="36" height="36" />
        <div>
          <h1>Connections</h1>
          <p>One place for each installation.</p>
        </div>
      </header>
      <div id="error" class="notice error" role="alert" hidden></div>
      <div id="session-note" class="notice" hidden>
        On this macOS version, remote logins last until you quit. macOS 14 or newer can remember
        them between launches.
      </div>
      <section aria-label="Your connections"><div id="connections"></div></section>
      <button id="add-toggle" class="add-toggle" aria-expanded="false">
        ＋ Add remote connection
      </button>
      <form id="add-form" hidden>
        <label for="url">Installation address</label
        ><input
          id="url"
          type="url"
          required
          placeholder="https://trestl.example.com"
          spellcheck="false"
          autocomplete="url"
        />
        <p class="hint">We’ll use the installation’s name. Sign in after opening it.</p>
        <div class="form-actions">
          <button id="cancel-add" type="button" class="secondary">Cancel</button
          ><button type="submit" class="primary">Add connection</button>
        </div>
      </form>
      <footer><span id="version"></span><span>Local data stays on this computer.</span></footer>
    </main>
    <script src="connections.js"></script>
  </body>
</html>
